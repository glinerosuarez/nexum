# pyproject.toml
[project]
name = "mcp-production-server"
version = "0.1.0"
description = "Production FastMCP server consuming public API and database layouts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "arize-otel>=0.8.0",
    "fastmcp>=0.4.1",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "langgraph>=0.1.0",
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "langchain-google-vertexai>=2.0.0",
    "langchain-ollama>=0.3.0",
    "google-cloud-aiplatform>=1.70.0",
    "google-auth>=2.35.0",
    "psycopg[binary]>=3.2.0",
    "supabase>=2.10.0",
]

substitutions:
  _SERVICE_NAME: nexum-api
  _REGION: us-central1
  _REPOSITORY: nexum

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.nexum_api
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA
      - --region=${_REGION}
      - --allow-unauthenticated
      - --port=8080
      - --set-env-vars=FIREBASE_AUTH_REQUIRED=true,FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID},SUPPLY_AGENT_MCP_URL=${_SUPPLY_AGENT_MCP_URL},SUPPLY_AGENT_MCP_REQUIRED=true

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA

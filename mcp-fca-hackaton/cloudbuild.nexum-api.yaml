substitutions:
  _SERVICE_NAME: nexum-api
  _REGION: us-central1
  _REPOSITORY: nexum
  _CLOUD_SQL_INSTANCE: nexum-497302:us-central1:nexum-postgres
  _SUPPLY_AGENT_MCP_TIMEOUT_MS: "300000"
  _ARIZE_PROJECT_NAME: nexum-supply-intelligence
  _PHOENIX_PROJECT_NAME: nexum-supply-intelligence
  _PHOENIX_COLLECTOR_ENDPOINT: https://app.phoenix.arize.com/s/linero
  _SUPPLY_AGENT_ORCHESTRATOR: adk
  _AGENT_BUILDER_MODEL: gemini-2.5-flash

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.nexum_api
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA
      - --region=${_REGION}
      - --allow-unauthenticated
      - --port=8080
      - --add-cloudsql-instances=${_CLOUD_SQL_INSTANCE}
      - --set-env-vars=CLOUD_SQL_INSTANCE=${_CLOUD_SQL_INSTANCE},FIREBASE_AUTH_REQUIRED=true,FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID},SUPPLY_AGENT_MCP_URL=${_SUPPLY_AGENT_MCP_URL},SUPPLY_AGENT_MCP_REQUIRED=true,SUPPLY_AGENT_MCP_TIMEOUT_MS=${_SUPPLY_AGENT_MCP_TIMEOUT_MS},ARIZE_PROJECT_NAME=${_ARIZE_PROJECT_NAME},PHOENIX_PROJECT_NAME=${_PHOENIX_PROJECT_NAME},PHOENIX_COLLECTOR_ENDPOINT=${_PHOENIX_COLLECTOR_ENDPOINT},SUPPLY_AGENT_ORCHESTRATOR=${_SUPPLY_AGENT_ORCHESTRATOR},AGENT_BUILDER_PROJECT_ID=$PROJECT_ID,AGENT_BUILDER_LOCATION=${_REGION},AGENT_BUILDER_MODEL=${_AGENT_BUILDER_MODEL},GOOGLE_GENAI_USE_VERTEXAI=true,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=${_REGION}
      - --update-secrets=DB_NAME=nexum-db-name:latest,DB_USER=nexum-db-user:latest,DB_PASS=nexum-db-pass:latest,FIREBASE_WEB_API_KEY=nexum-firebase-web-api-key:latest,ARIZE_API_KEY=nexum-arize-api-key:latest,ARIZE_SPACE_ID=nexum-arize-space-id:latest,PHOENIX_API_KEY=nexum-phoenix-api-key:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA

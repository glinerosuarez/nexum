# Supabase credentials for mi-servidor-mcp
#
# 1. Replace the placeholder values below with your Supabase project settings:
#    - Project URL:     Supabase Dashboard → Project Settings → API → Project URL
#    - service_role_key: same page → service_role (secret — server only)
#    - anon_key:         same page → anon / public key (for optional user JWT / RLS)
#
# 2. Apply:
#      kubectl apply -f k8s/secret-supabase.yaml
#
# 3. Restart the deployment so pods pick up the secret:
#      kubectl rollout restart deployment/mi-servidor-mcp
#
# Do not commit real keys to git. Add this file to .gitignore if you store real values here.

apiVersion: v1
kind: Secret
metadata:
  name: mcp-supabase
  labels:
    app: mi-servidor-mcp
type: Opaque
stringData:
  url: "https://your-project.supabase.co"
  service_role_key: "replace-with-service-role-key"
  anon_key: "replace-with-anon-key"
